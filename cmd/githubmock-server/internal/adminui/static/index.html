<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>githubmock admin</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 28px; }
    section { max-width: 720px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    th { background: #f5f5f5; }
    label { display: block; margin-top: 10px; font-size: 13px; }
    select, input { width: 100%; padding: 6px; box-sizing: border-box; font-size: 13px; margin-top: 2px; }
    button { margin-top: 14px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
    pre { background: #f7f7f7; padding: 10px; overflow-x: auto; font-size: 12px; max-height: 360px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
  </style>
</head>
<body>
  <h1>githubmock admin</h1>

  <section>
    <h2>Send webhook</h2>
    <div class="row">
      <div>
        <label>Repository
          <select id="repository"></select>
        </label>
      </div>
      <div>
        <label>Event
          <select id="event">
            <option value="pull_request">pull_request</option>
            <option value="push">push</option>
          </select>
        </label>
      </div>
    </div>

    <div id="pr-fields">
      <div class="row">
        <div>
          <label>Action
            <select id="action">
              <option>opened</option>
              <option>closed</option>
              <option>reopened</option>
              <option>edited</option>
              <option>synchronize</option>
              <option>ready_for_review</option>
            </select>
          </label>
        </div>
        <div>
          <label>Pull request
            <select id="pr-number"></select>
          </label>
        </div>
      </div>
    </div>

    <div id="push-fields" style="display:none;">
      <div class="row">
        <div>
          <label>Ref
            <input id="ref" type="text" value="refs/heads/main" />
          </label>
        </div>
        <div>
          <label>Commit
            <select id="commit-sha"></select>
          </label>
        </div>
      </div>
    </div>

    <label>Sender login (optional)
      <input id="sender" type="text" placeholder="octocat" />
    </label>

    <button id="send">Send</button>

    <h2>Webhooks on this repository</h2>
    <table id="webhook-table">
      <thead><tr><th>URL</th><th>Events</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>Result</h2>
    <pre id="result">(no requests yet)</pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
